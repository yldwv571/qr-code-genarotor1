<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="top-bar">
        <button id="theme-toggle" class="theme-btn">
            <i class="fa-solid fa-moon"></i> <span>Dark</span>
        </button>
    </div>

    <div class="container">
        <h1><i class="fa-solid fa-qrcode"></i> QR Code Generator</h1>
        <p class="subtitle">Ma'lumotlaringizni tez va oson QR kodga aylantiring</p>

        <div class="input-group">
            <div class="input-field">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" placeholder="Ism kiriting">
            </div>
            <div class="input-field">
                <i class="fa-solid fa-phone"></i>
                <input type="text" id="phone" placeholder="Nomer Kiriting">
            </div>
            <div class="input-field">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Kiriting">
            </div>
            <div class="input-field">
                <i class="fa-solid fa-globe"></i>
                <input type="url" id="website" placeholder="Web sayt Kiriting">
            </div>
            <div class="input-field">
                <i class="fa-solid fa-briefcase"></i>
                <input type="text" id="job" placeholder="Kasb Hunar Kiriting">
            </div>
        </div>

        <div class="qr-settings">
            <div class="color-picker-wrapper">
                <label for="qr-color">QR Rang:</label>
                <input type="color" id="qr-color" value="#000000">
            </div>
            <div class="color-picker-wrapper">
                <label for="bg-color">Fon Rang:</label>
                <input type="color" id="bg-color" value="#ffffff">
            </div>
        </div>

        <!-- Tugmaning o'zi aylanadi -->
        <button id="generate-btn">Generate QR Code</button>

        <div class="result-container" id="result-box">
            <div id="qrcode"></div>
            <a id="download-btn" class="download-btn" style="display: none;">
                <i class="fa-solid fa-download"></i> QR Kodni Yuklab Olish
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
